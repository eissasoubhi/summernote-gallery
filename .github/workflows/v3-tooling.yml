name: v3 toolchain

on:
  push:
    branches:
      - agent/v3-vite-toolchain
  pull_request:
    branches:
      - agent/v3-summernote-native

permissions:
  contents: read

jobs:
  quality:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Install isolated v3 toolchain
        working-directory: v3-tooling
        run: npm install

      - name: Typecheck, test, build and validate package shape
        working-directory: v3-tooling
        run: npm run check
