name: Generate v3 lockfile

on:
  push:
    branches:
      - agent/v3-lockfile

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v3-lockfile
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Validate lockfile install
        run: npm ci --ignore-scripts
      - name: Run package checks
        run: npm run check
      - name: Commit validated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/generate-lockfile.yml
          git commit -m "build: add reproducible v3 lockfile"
          git push origin HEAD:agent/v3-lockfile
