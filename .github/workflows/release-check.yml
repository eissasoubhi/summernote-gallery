name: Release check

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    name: Validate npm release candidate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Verify tag matches package version
        run: |
          package_version="$(node -p "require('./package.json').version")"
          expected_tag="v${package_version}"
          if [ "${GITHUB_REF_NAME}" != "${expected_tag}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${package_version}; expected ${expected_tag}"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Quality gate
        run: npm run check

      - name: Inspect package contents
        run: npm pack --dry-run

      - name: Build npm tarball
        run: npm pack
