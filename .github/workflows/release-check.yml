name: Release check

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    name: Validate npm release candidate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Verify tag matches package version
        run: npm run release:tag-check

      - name: Install dependencies
        run: npm ci

      - name: Quality gate
        run: npm run check

      - name: Inspect package contents
        run: npm pack --dry-run

      - name: Build npm tarball
        run: npm pack
